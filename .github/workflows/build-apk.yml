name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v3

      - name: Python o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Buildozer va bog'liqliklarni o'rnatish
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --user buildozer cython

      - name: Buildozer keshi
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: APK qurish
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug

      - name: APK faylni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: apk-fayl
          path: bin/*.apk